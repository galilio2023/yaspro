<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Background Emblem Halo -->
    <radialGradient id="logo-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1040" />
      <stop offset="60%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#03020a" />
    </radialGradient>

    <!-- Neon Rim Left (Violet) -->
    <linearGradient id="logo-neon-v" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Rim Right (Cyan) -->
    <linearGradient id="logo-neon-c" x1="100%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 3D Facet Left -->
    <linearGradient id="logo-facet-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- 3D Facet Right -->
    <linearGradient id="logo-facet-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Typography Gradient -->
    <linearGradient id="logo-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Cinema Lens Y Emblem -->
  <g transform="translate(8, 7)">
    <circle cx="25" cy="25" r="24" fill="url(#logo-halo)" stroke="#334155" stroke-width="1.2" />
    <circle cx="25" cy="25" r="21" stroke="#475569" stroke-width="0.75" stroke-dasharray="1.5 2.5" opacity="0.6" />

    <!-- Left Neon Arc -->
    <path d="M 25 3 A 22 22 0 0 0 25 47" stroke="url(#logo-neon-v)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Neon Arc -->
    <path d="M 25 3 A 22 22 0 0 1 25 47" stroke="url(#logo-neon-c)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Geometric 3D Y -->
    <g>
      <!-- Left Arm -->
      <polygon points="12,12 19,12 25,23 21,27 12,12" fill="url(#logo-facet-l)" stroke="#a855f7" stroke-width="0.5" />
      <!-- Right Arm -->
      <polygon points="38,12 31,12 25,23 29,27 38,12" fill="url(#logo-facet-r)" stroke="#06b6d4" stroke-width="0.5" />
      <!-- Stem Column -->
      <polygon points="21,25 29,25 29,38 21,38" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
      <!-- Wedge Foot -->
      <polygon points="21,38 25,41 29,38 25,36" fill="#38bdf8" />

      <!-- Specular Lines -->
      <line x1="12" y1="12" x2="21" y2="26" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
      <line x1="38" y1="12" x2="29" y2="26" stroke="#67e8f9" stroke-width="0.8" opacity="0.9" />
      <line x1="25" y1="23" x2="25" y2="41" stroke="#ffffff" stroke-width="0.9" opacity="0.8" />
    </g>
  </g>

  <!-- Typography: YASPRO -->
  <g transform="translate(68, 38)">
    <text font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">
      YAS<tspan fill="url(#logo-text-grad)">PRO</tspan>
    </text>
  </g>

  <!-- Subtitle: AI MEDIA HUB • DUBAI -->
  <g transform="translate(69, 52)">
    <text font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="2.8">
      AI MEDIA HUB <tspan fill="#06b6d4">•</tspan> DUBAI
    </text>
  </g>
</svg>
