<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="yaspro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9450ce" />
      <stop offset="50%" stop-color="#e7cbff" />
      <stop offset="100%" stop-color="#12c2e9" />
    </linearGradient>
    <linearGradient id="yaspro-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9450ce" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#12c2e9" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Iconic Hexagonal Aperture / Y-Prism Emblem -->
  <g transform="translate(6, 4)">
    <!-- Ambient glow behind icon -->
    <circle cx="28" cy="28" r="26" fill="url(#yaspro-glow)" opacity="0.6" filter="url(#glow-blur)" />
    
    <!-- Outer faceted polygon with rich brand background -->
    <rect x="2" y="2" width="52" height="52" rx="16" fill="url(#yaspro-glow)" fill-opacity="0.25" stroke="url(#yaspro-grad)" stroke-width="2" />
    
    <!-- Geometric 'Y' and Camera Aperture Lines -->
    <path d="M16 16 L28 29 L40 16" stroke="url(#yaspro-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 29 L28 42" stroke="url(#yaspro-grad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Center AI Sparkle Core -->
    <circle cx="28" cy="29" r="3" fill="#ffffff" filter="url(#glow-blur)" />
    
    <!-- Corner Lens Accent Points -->
    <circle cx="43" cy="13" r="1.5" fill="#12c2e9" />
    <circle cx="13" cy="43" r="1.5" fill="#9450ce" />
  </g>

  <!-- Typography: YASPRO -->
  <g transform="translate(74, 37)">
    <text font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="25" fill="#ffffff" letter-spacing="-0.5">
      YAS<tspan fill="url(#yaspro-grad)">PRO</tspan>
    </text>
  </g>

  <!-- Subtitle: AI MEDIA HUB • DUBAI -->
  <g transform="translate(75, 52)">
    <text font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#888899" letter-spacing="2.8">
      AI MEDIA HUB <tspan fill="#12c2e9">•</tspan> DUBAI
    </text>
  </g>
</svg>
