<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Crisp Studio White Blade Gradient -->
    <linearGradient id="yas-blade-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Official Brand Yellow Accent Blade -->
    <linearGradient id="yas-blade-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff04d" />
      <stop offset="60%" stop-color="#ffe900" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Circular background (transparent outside circle) -->
  <circle cx="256" cy="256" r="252" fill="#070709" stroke="rgba(152,123,165,0.4)" stroke-width="3" />

  <!-- The 8 aperture blades matching yas-pro-media-group.png -->
  <g>
    <!-- 7 White blades with dark seam dividers -->
    <path
      d="M 326,349 L 88,448 L 92,453 L 118,472 L 135,482 L 166,496 L 184,502 L 216,509 L 231,511 L 260,510 L 264,498 L 270,486 L 276,469 L 282,457 L 293,428 L 306,399 Z M 372,273 L 367,283 L 349,329 L 331,370 L 313,416 L 273,511 L 288,510 L 311,506 L 327,502 L 362,489 L 378,480 L 380,480 L 405,464 L 424,449 L 439,434 L 431,417 L 425,400 L 408,359 L 402,347 Z M 0,272 L 5,309 L 11,332 L 22,361 L 31,379 L 46,403 L 65,427 L 77,436 L 84,434 L 89,431 L 237,371 L 203,356 L 98,313 L 79,304 L 55,295 L 36,286 L 2,272 Z M 350,187 L 376,248 L 392,289 L 398,301 L 421,359 L 427,371 L 446,419 L 449,424 L 466,402 L 478,383 L 488,364 L 497,342 L 503,323 L 509,294 L 511,278 L 511,253 L 449,228 L 420,215 L 374,197 L 357,189 Z M 64,87 L 54,98 L 36,124 L 21,153 L 15,168 L 8,190 L 4,207 L 0,237 L 1,258 L 161,325 L 126,238 L 120,226 L 119,221 L 102,182 L 69,99 L 64,89 Z M 239,1 L 222,2 L 195,7 L 174,13 L 151,22 L 133,31 L 109,46 L 86,64 L 74,76 L 74,79 L 140,238 Z M 186,162 L 300,116 L 317,108 L 405,72 L 422,66 L 425,64 L 404,47 L 382,33 L 369,26 L 343,15 L 324,9 L 303,4 L 270,0 L 253,1 Z"
      fill="url(#yas-blade-white)"
      stroke="#070709"
      stroke-width="4.5"
      stroke-linejoin="round"
      fill-rule="evenodd"
    />

    <!-- Signature yellow blade -->
    <path
      d="M 274,141 L 511,239 L 509,218 L 505,197 L 497,170 L 489,150 L 477,127 L 464,107 L 449,88 L 438,76 L 435,74 Z"
      fill="url(#yas-blade-yellow)"
      stroke="#070709"
      stroke-width="4.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Center pupil / iris aperture hole -->
  <circle cx="256" cy="256" r="112" fill="#070709" stroke="rgba(152,123,165,0.4)" stroke-width="2" />
  <circle cx="256" cy="256" r="64" fill="rgba(152,123,165,0.15)" />
</svg>
