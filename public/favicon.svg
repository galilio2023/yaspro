<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep luxury obsidian / midnight violet -->
    <radialGradient id="fav-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#180b33" />
      <stop offset="50%" stop-color="#090514" />
      <stop offset="100%" stop-color="#020108" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neon Rim Left (Violet) -->
    <linearGradient id="fav-neon-v" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Rim Right (Cyan) -->
    <linearGradient id="fav-neon-c" x1="100%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 3D Facet Left -->
    <linearGradient id="fav-facet-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- 3D Facet Right -->
    <linearGradient id="fav-facet-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="1.2" />

  <!-- Outer Optical Ring -->
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1" />
  <circle cx="32" cy="32" r="20" stroke="#475569" stroke-width="0.75" stroke-dasharray="1.5 2.5" opacity="0.6" />

  <!-- Left Neon Arc -->
  <path d="M 32 9 A 23 23 0 0 0 32 55" stroke="url(#fav-neon-v)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Neon Arc -->
  <path d="M 32 9 A 23 23 0 0 1 32 55" stroke="url(#fav-neon-c)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Geometric 3D Y -->
  <g>
    <!-- Left Arm -->
    <polygon points="18,18 26,18 32,30 28,34 18,18" fill="url(#fav-facet-l)" stroke="#a855f7" stroke-width="0.6" />
    <!-- Right Arm -->
    <polygon points="46,18 38,18 32,30 36,34 46,18" fill="url(#fav-facet-r)" stroke="#06b6d4" stroke-width="0.6" />
    <!-- Stem Column -->
    <polygon points="28,32 36,32 36,46 28,46" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
    <!-- Wedge Foot -->
    <polygon points="28,46 32,50 36,46 32,44" fill="#38bdf8" />

    <!-- Specular Highlight Lines -->
    <line x1="18" y1="18" x2="28" y2="33" stroke="#ffffff" stroke-width="0.9" opacity="0.85" />
    <line x1="46" y1="18" x2="36" y2="33" stroke="#67e8f9" stroke-width="0.9" opacity="0.95" />
    <line x1="32" y1="30" x2="32" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.8" />
  </g>
</svg>
