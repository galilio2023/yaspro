<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Sensor Core Glow -->
    <radialGradient id="fav-core" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Rim Stroke -->
    <linearGradient id="fav-rim-amber" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="fav-rim-plat" x1="100%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 3D "Y" Left Arm Facet (Specular Titanium Silver) -->
    <linearGradient id="fav-facet-l" x1="15%" y1="15%" x2="55%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- 3D "Y" Right Arm Facet (Polished 24K Cinema Gold) -->
    <linearGradient id="fav-facet-r" x1="85%" y1="15%" x2="45%" y2="60%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 3D "Y" Center Stem Facet (High-Contrast Platinum Alloy) -->
    <linearGradient id="fav-facet-stem" x1="45%" y1="50%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- NO background rect: 100% Transparent -->

  <!-- 1. Precision Optical Outer Lens Ring -->
  <circle cx="32" cy="32" r="28" stroke="#3f3f46" stroke-width="1.2" stroke-opacity="0.6" />
  <circle cx="32" cy="32" r="25" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="1.5 2.5" stroke-opacity="0.5" />

  <!-- 2. Warm Optical Backlight (Subtle Sensor Glow) -->
  <circle cx="32" cy="32" r="22" fill="url(#fav-core)" />

  <!-- 3. Aperture Indicator Blades -->
  <g opacity="0.4" stroke="#ffffff" stroke-width="0.75">
    <line x1="32" y1="7" x2="23" y2="27" />
    <line x1="56" y1="19" x2="39" y2="30" />
    <line x1="53" y1="49" x2="36" y2="38" />
    <line x1="25" y1="55" x2="28" y2="36" />
    <line x1="10" y1="37" x2="26" y2="30" />
  </g>

  <!-- 4. Luminous Warm Tungsten Amber Arc (Left Rim) -->
  <path d="M 32 4 A 28 28 0 0 0 32 60" stroke="url(#fav-rim-amber)" stroke-width="3" stroke-linecap="round" />

  <!-- 5. Brilliant Platinum Specular Arc (Right Rim) -->
  <path d="M 32 4 A 28 28 0 0 1 32 60" stroke="url(#fav-rim-plat)" stroke-width="3" stroke-linecap="round" />

  <!-- 6. High-Contrast 3D "Y" Emblem -->
  <g>
    <!-- Left Arm (Specular Titanium Silver) -->
    <polygon points="15,14 25,14 32,30 27,35 15,14" fill="url(#fav-facet-l)" stroke="#ffffff" stroke-width="0.9" />

    <!-- Right Arm (Polished 24K Cinema Gold) -->
    <polygon points="49,14 39,14 32,30 37,35 49,14" fill="url(#fav-facet-r)" stroke="#fde047" stroke-width="0.9" />

    <!-- Center Chiseled Spine -->
    <polygon points="27,32 37,32 37,49 27,49" fill="url(#fav-facet-stem)" stroke="#ffffff" stroke-width="0.7" />

    <!-- Diamond Base Wedge (Brilliant Amber Gold) -->
    <polygon points="27,49 32,54 37,49 32,46" fill="#fbbf24" stroke="#ffffff" stroke-width="0.6" />

    <!-- High-Luminance Specular Ridges -->
    <line x1="15" y1="14" x2="27" y2="33" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" />
    <line x1="49" y1="14" x2="37" y2="33" stroke="#fffbeb" stroke-width="1.1" stroke-linecap="round" />
    <line x1="32" y1="30" x2="32" y2="54" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- Center Optical Sensor Glint Star -->
    <circle cx="32" cy="30" r="1.8" fill="#ffffff" />
  </g>
</svg>
